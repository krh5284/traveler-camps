[caches]
  [caches.assets]
    dir = ':resourceDir/_gen'
    maxAge = -1
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = -1
  [caches.images]
    dir = ':cacheDir/images'
    maxAge = -1
  [caches.misc]
    dir = ':cacheDir/:project'
    maxAge = -1
  [caches.modulegitinfo]
    dir = ':cacheDir/modules'
    maxAge = '24h'
  [caches.modulequeries]
    dir = ':cacheDir/modules'
    maxAge = '24h'
  [caches.modules]
    dir = ':cacheDir/modules'
    maxAge = -1

[params.homeInfoParams]
Title = "Welcome to Traveler Camps"
Content = """
The goal of this site is to provide one location where traveling workers can find campgrounds and RV parks near their job site. 
Our site is new and our map is incomplete. Please help us add to the map by following the links at the top right of the page.
Go to the [Map](http://localhost:1313/traveler-camps/map/)
"""


